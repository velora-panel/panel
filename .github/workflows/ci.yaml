name: Quality
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: velora
          POSTGRES_PASSWORD: ci_ephemeral_only
          POSTGRES_DB: velora_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U velora -d velora_test'
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://velora:ci_ephemeral_only@127.0.0.1:5432/velora_test
      POSTGRES_PASSWORD: ci_ephemeral_only
      PUBLIC_URL: https://console.example.test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.21.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/core/go.mod
          cache-dependency-path: |
            apps/core/go.sum
            apps/cli/go.sum
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:integration
      - run: pnpm test:cli
      - run: pnpm --filter @velora/console exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm audit --audit-level high
      - run: pnpm --filter @velora/core vuln
      - run: docker compose config --quiet
      - run: docker compose build
