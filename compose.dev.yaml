# Standalone development dependency services only; no application containers.
name: velora-dev
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-velora}
      POSTGRES_DB: ${POSTGRES_DB:-velora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ['127.0.0.1:5432:5432']
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8-alpine
    profiles: [redis]
    ports: ['127.0.0.1:6379:6379']
volumes:
  postgres-data:
