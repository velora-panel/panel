name: velora
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-velora}
      POSTGRES_DB: ${POSTGRES_DB:-velora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  core:
    build:
      context: .
      dockerfile: docker/core.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DATABASE_URL: postgres://${POSTGRES_USER:-velora}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-velora}?sslmode=disable
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          wget,
          -q,
          -O,
          /dev/null,
          'http://127.0.0.1:8080/api/v1/health/ready',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    stop_grace_period: 15s
    restart: unless-stopped
  console:
    build:
      context: .
      dockerfile: docker/console.Dockerfile
    ports: ['127.0.0.1:8088:8080']
    depends_on:
      core: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  redis:
    image: redis:8-alpine
    profiles: [redis]
    command: [redis-server, --save, '', --appendonly, 'no']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  postgres-data:
